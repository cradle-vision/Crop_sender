syntax = "proto3";

package snapshot;

// Service for sending snapshots to AI server
service SnapshotService {
  // Send single snapshot
  rpc SendSnapshot(SnapshotRequest) returns (SnapshotResponse);
}

// Snapshot request
message SnapshotRequest {
  string camera_id = 1;  // Camera identifier
  bytes image_data = 2;  // Image in JPEG/PNG format
  int64 timestamp = 3;   // Timestamp
  string format = 4;     // Image format (jpeg, png)
}

// Response from AI server
message SnapshotResponse {
  bool success = 1;
  string message = 2;
}
