# Configuration for sending snapshots to AI server
grpc:
  server_address: "localhost:50051"  # gRPC server address
  max_message_size: 4194304  # 4MB

# Cameras: from backend (env BACKEND_URL + CAMERAS_ENDPOINT) or cameras.yaml
backend:
  url: null  # env BACKEND_URL — base URL (e.g. http://localhost:8000)
  cameras_endpoint: "/api/cameras"  # env CAMERAS_ENDPOINT — GET returns {"cameras": [...]}
  timeout: 10

# Sender 2: face crop — detect face, crop, send to user endpoint
crop:
  enabled: false  # env CROP_ENABLED=true to enable
  destination_url: null  # env CROP_DESTINATION_URL — POST crop image (e.g. http://backend/api/user/crop)
  timeout: 5

agent:
  buffer_size: 30  # Snapshot buffer size
  timeout: 5.0  # gRPC request timeout (seconds)
  default_fps: null  # Default FPS for all cameras (null = use backend/cameras.yaml, or set value to override)
