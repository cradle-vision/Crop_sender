# Camera → detect people → crop → [MinIO] → Kafka → backend → Triton
kafka:
  bootstrap_servers: "localhost:9092"
  topic: "snapshots"
  jpeg_quality: 85

# Optional: upload crops to MinIO, send only bucket + object_key in Kafka (less traffic)
minio:
  enabled: false
  endpoint: "localhost:9000"
  bucket: "crops"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  secure: false

# RTSP: use FFmpeg subprocess for capture (avoids "RTP bad cseq" / decoding errors)
rtsp:
  use_ffmpeg_pipe: true  # set false to use OpenCV; env RTSP_USE_FFMPEG_PIPE overrides

# Detection: "face" (OpenCV Haar) or "person" (YOLOv8 ONNX from cpu-person-detection)
detection:
  type: person  # face | person
  person_model_path: null  # or path; default: cpu-person-detection/models/person_detection_model.onnx
  person_conf: 0.4  # confidence threshold for person

agent:
  buffer_size: 30
  default_fps: 2  # default FPS for all cameras (cameras per-camera fps as fallback if null)

# Optional: fetch camera list from backend (GET JSON: { "cameras": [ { camera_id, name, source, type, ... } ] })
backend:
  cameras_url: null   # e.g. "http://localhost:8000/api/cameras"
  cameras_timeout: 10
