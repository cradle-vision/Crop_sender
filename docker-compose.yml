# Sender-crop: камеры → детекция → crop → Kafka (опционально MinIO). network_mode: host для доступа к камерам и Kafka.

services:
  sender-crop:
    build: .
    container_name: sender-crop
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro
      - ./cameras.yaml:/app/cameras.yaml:rw
      - ./config.yaml:/app/config.yaml:ro
    env_file:
      - .env
    environment:
      - CONFIG_PATH=/app/config.yaml
      - CAMERAS_CONFIG_PATH=/app/cameras.yaml
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
      - KAFKA_TOPIC=${KAFKA_TOPIC:-snapshots}
      - DEFAULT_FPS=${DEFAULT_FPS:-}
    network_mode: host
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

