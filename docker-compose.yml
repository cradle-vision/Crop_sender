services:
  sender-crop:
    build: .
    container_name: sender-crop
    restart: unless-stopped
    shm_size: "512m"
    pids_limit: 8192
    volumes:
      - ./config:/app/config:rw
    env_file:
      - .env
    environment:
      - CAMERAS_CONFIG_PATH=/app/config/cameras.yaml
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
      - SENDER_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
      - SENDER_MINIO_ENDPOINT=${MINIO_ENDPOINT:-localhost:9000}
    network_mode: host

  # Local RTSP relay: one stable pull per camera; FFmpeg reads localhost (not camera directly).
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    profiles: ["streaming"]
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    network_mode: host

  # Optional live streaming — separate container/process from sender-crop.
  # Start when needed: docker compose --profile streaming up -d
  streaming-agent:
    build: .
    container_name: streaming-agent
    restart: unless-stopped
    profiles: ["streaming"]
    depends_on:
      - mediamtx
    pids_limit: 4096
    volumes:
      - ./config:/app/config:ro
      - ./streaming_agent/streaming-agent.yaml.example:/app/streaming-agent.yaml:ro
    env_file:
      - .env
    environment:
      - STREAMING_AGENT_CONFIG=/app/streaming-agent.yaml
      - CAMERAS_CONFIG_PATH=/app/config/cameras.yaml
      - STREAMING_UPSTREAM_TRANSCODE=${STREAMING_UPSTREAM_TRANSCODE:-true}
      - STREAMING_USE_SUBSTREAM=${STREAMING_USE_SUBSTREAM:-true}
      - MEDIAMTX_PUBLIC_WEBRTC_BASE=${MEDIAMTX_PUBLIC_WEBRTC_BASE:-http://127.0.0.1:8889}
      - STREAMING_BACKEND_URL=${STREAMING_BACKEND_URL:-ws://127.0.0.1:8000/ws/agent}
    command: ["python3", "-m", "streaming_agent.main", "-c", "/app/streaming-agent.yaml"]
    network_mode: host
