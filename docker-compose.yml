services:
  sender-crop:
    build: .
    container_name: sender-crop
    restart: unless-stopped
    volumes:
      - ./config:/app/config:rw
    env_file:
      - .env
    environment:
      - CAMERAS_CONFIG_PATH=/app/config/cameras.yaml
      - SENDER_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
      - SENDER_MINIO_ENDPOINT=${MINIO_ENDPOINT:-localhost:9000}
    network_mode: host
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # RTSP → WebRTC (MediaMTX) + edge Streaming Agent (WebSocket control)
  mediamtx:
    image: bluenviron/mediamtx:1.17.0
    container_name: mediamtx
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "9997:9997"
      - "8889:8889"
      - "8554:8554"
      - "8189:8189/udp"

  streaming-agent:
    build: .
    container_name: streaming-agent
    restart: unless-stopped
    depends_on:
      - mediamtx
    volumes:
      - ./streaming_agent/streaming-agent.yaml.example:/app/config/streaming-agent.yaml:ro
    env_file:
      - .env
    environment:
      - STREAMING_AGENT_CONFIG=/app/config/streaming-agent.yaml
      - MEDIAMTX_API_URL=http://mediamtx:9997
      # reuse sender-crop camera list
      - CAMERAS_CONFIG_PATH=/app/config/cameras.yaml
      - MEDIAMTX_PUBLIC_WEBRTC_BASE=${MEDIAMTX_PUBLIC_WEBRTC_BASE:-http://127.0.0.1:8889}
      - STREAMING_BACKEND_URL=${STREAMING_BACKEND_URL:-ws://host.docker.internal:8000/ws/agent}
    command: ["python3", "-m", "streaming_agent.main", "-c", "/app/config/streaming-agent.yaml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

