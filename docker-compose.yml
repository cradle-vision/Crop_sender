services:
  sender-crop:
    image: ${AGENT_IMAGE:-ghcr.io/cradle-vision/crop-sender:main}
    container_name: sender-crop
    restart: unless-stopped
    shm_size: "512m"
    pids_limit: 8192
    volumes:
      - ./config:/app/config:rw
      # File bind-mount keeps host .env in sync with remote apply_env (write is in-place).
      - ./.env:/app/.env:rw
      # OTA: host docker CLI + sock so software_update can pull/recreate
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro
      - ./:/opt/crop_sender:ro
      # Run local sender code until the next GHCR image includes exclude zones.
      - ./sender:/app/sender:ro
      - ./yunet:/app/yunet:ro
    env_file:
      - .env
    environment:
      - CAMERAS_CONFIG_PATH=/app/config/cameras.yaml
      - KAFKA_BOOTSTRAP_SERVERS=198.163.196.167:9092
      - SENDER_KAFKA_BOOTSTRAP_SERVERS=198.163.196.167:9092
      - SENDER_MINIO_ENDPOINT=${MINIO_ENDPOINT:-64.227.62.36:9005}
      - AGENT_VERSION=${AGENT_VERSION:-latest}
      - AGENT_ENV_PATH=/app/.env
      - AGENT_CONTROL_ENABLED=${AGENT_CONTROL_ENABLED:-true}
      # Streaming profile: streaming-agent claims config/.agent_ws_owner; sender skips WS automatically.
      - AGENT_COMPOSE_DIR=${AGENT_COMPOSE_DIR:-/opt/crop_sender}
      - AGENT_UPDATE_CMD=${AGENT_UPDATE_CMD:-bash /opt/crop_sender/scripts/update-agent.sh}
    network_mode: host

  mediamtx:
    image: bluenviron/mediamtx:1.11.3
    container_name: mediamtx
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    network_mode: host

  # Loop videos/loop.mp4 and publish it as a fake RTSP camera:
  #   rtsp://127.0.0.1:8554/fake-store
  fake-rtsp:
    image: linuxserver/ffmpeg:latest
    container_name: fake-rtsp
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mediamtx
    volumes:
      - ./videos/loop.mp4:/videos/loop.mp4:ro
    command:
      - -hide_banner
      - -loglevel
      - info
      - -re
      - -stream_loop
      - "-1"
      - -fflags
      - +genpts
      - -i
      - /videos/loop.mp4
      - -map
      - 0:v:0
      - -an
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -pix_fmt
      - yuv420p
      - -g
      - "50"
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://127.0.0.1:8554/fake-store

  streaming-agent:
    image: ${AGENT_IMAGE:-ghcr.io/cradle-vision/crop-sender:main}
    container_name: streaming-agent
    restart: unless-stopped
    profiles: ["streaming"]
    depends_on:
      - mediamtx
    pids_limit: 4096
    volumes:
      - ./config:/app/config:rw
      - ./.env:/app/.env:rw
      - ./streaming_agent/streaming-agent.yaml.example:/app/streaming-agent.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro
      - ./:/opt/crop_sender:ro
      - ./sender:/app/sender:ro
      - ./streaming_agent:/app/streaming_agent:ro
      - ./agent_control:/app/agent_control:ro
    env_file:
      - .env
    environment:
      - STREAMING_AGENT_CONFIG=/app/streaming-agent.yaml
      - CAMERAS_CONFIG_PATH=/app/config/cameras.yaml
      - STREAMING_UPSTREAM_TRANSCODE=${STREAMING_UPSTREAM_TRANSCODE:-true}
      - STREAMING_USE_SUBSTREAM=${STREAMING_USE_SUBSTREAM:-true}
      - MEDIAMTX_PUBLIC_WEBRTC_BASE=${MEDIAMTX_PUBLIC_WEBRTC_BASE:-http://127.0.0.1:8889}
      - STREAMING_BACKEND_URL=${STREAMING_BACKEND_URL:-wss://api.retailsolution.ai/ws/agents}
      - AGENT_VERSION=${AGENT_VERSION:-latest}
      - AGENT_ENV_PATH=/app/.env
      - AGENT_COMPOSE_DIR=${AGENT_COMPOSE_DIR:-/opt/crop_sender}
      - AGENT_UPDATE_CMD=${AGENT_UPDATE_CMD:-bash /opt/crop_sender/scripts/update-agent.sh}
    command: ["python3", "-m", "streaming_agent.main", "-c", "/app/streaming-agent.yaml"]
    network_mode: host
