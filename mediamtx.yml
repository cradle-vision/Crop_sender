# MediaMTX for Streaming Agent MVP (RTSP pull → WebRTC WHEP).
# Docs: https://mediamtx.org/docs/references/configuration-file

logLevel: info
logDestinations: [stdout]

readTimeout: 10s
writeTimeout: 10s

# Control API (used by streaming_agent to add/remove paths)
api: true
apiAddress: :9997
apiAllowOrigins: ['*']

# WebRTC / WHEP (browser connects here; set MEDIAMTX_PUBLIC_WEBRTC_BASE on the agent)
webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: true
webrtcAdditionalHosts: []

# STUN (add TURN URLs here for restrictive NATs)
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

rtsp: true
rtspAddress: :8554

paths:
  all_others:
