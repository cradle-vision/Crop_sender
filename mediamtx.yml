# MediaMTX: local RTSP relay for streaming-agent (camera → localhost → FFmpeg → RTMP).
# Docs: https://mediamtx.org/docs/references/configuration-file

logLevel: info
logDestinations: [stdout]

readTimeout: 30s
writeTimeout: 30s

api: true
apiAddress: :9997
apiAllowOrigins: ['*']

webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: true
webrtcAdditionalHosts: []

webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

rtsp: true
rtspAddress: :8554

# Relay paths (up_<camera_id>) are added via API with sourceOnDemand per path.

paths:
  all_others:
